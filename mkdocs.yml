# The docs site (roadmap 6.2, ADR-0115): tutorial, how-to guides, the plugin-author
# guide, and a generated API reference over `mycelium.sdk`. Canonical content — the
# spec, the ADRs, the pattern catalogue, the compatibility promise — stays in `docs/`
# and this site links out to it rather than duplicating it (D-029: "mycelium-docs may
# host the docs-site build at most; canonical content stays in-repo"). Build locally
# with `uv run mkdocs serve`; CI builds it with `--strict` so a broken link or an
# unresolved API reference fails the build rather than shipping quietly.

site_name: Mycelium OS
site_description: The knowledge compiler for AI agents.
site_url: https://danielpolowork.github.io/mycelium-os/
repo_url: https://github.com/danielPoloWork/mycelium-os
repo_name: danielPoloWork/mycelium-os
edit_uri: edit/main/docs-site/
docs_dir: docs-site
site_dir: site
strict: true

copyright: Copyright &copy; 2026 Daniel Polo — Apache-2.0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - How-to guides:
      - how-to/index.md
      - Ingest an external document: how-to/ingest-a-document.md
      - Query from an agent over MCP: how-to/query-over-mcp.md
      - Verify and promote a synthesized document: how-to/verify-and-promote.md
      - Roll back to an earlier snapshot: how-to/roll-back-a-snapshot.md
  - Plugin author guide: plugin-author-guide.md
  - Reference:
      - reference/index.md
      - SDK: reference/sdk.md
  - Project:
      - project.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets
