[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycelium-os"
dynamic = ["version"]
description = "The knowledge compiler for AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Daniel Polo" }]
# What a registry shows about this package, and what a search there matches on
# (roadmap 6.11). Absent until the publish flow was built, which meant the index
# page would have carried no audience, no Python versions and no topic at all —
# invisible to exactly the reader the dogfooding gate needs to reach (6.12).
#
# No `License ::` classifier: `license = "Apache-2.0"` above is a PEP 639 SPDX
# expression, and the metadata carries it as `License-Expression`. PEP 639
# deprecates the classifier form, so declaring both would state one fact twice
# and in the older spelling.
keywords = [
    "agents",
    "citations",
    "knowledge-graph",
    "knowledge-management",
    "llm",
    "markdown",
    "mcp",
    "rag",
    "retrieval",
    "search",
]
classifiers = [
    # Pre-1.0 and milestone-driven: the five stable contracts are pinned and the
    # compatibility promise is published, but it binds at v1.0.0 (ADR-0114), so
    # this is not yet "5 - Production/Stable".
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
# Runtime closure, kept deliberately small and offline (D-013/D-017):
#   pydantic       — the record contracts, pinned by the spec (ADR-0004); >=2.11 for
#                    the `serialize_by_alias` model config.
#   markdown-it-py — CommonMark + the rule pipeline the profile extends (ADR-0006).
#   PyYAML         — frontmatter (ADR-0006 records the YAML 1.1 caveat).
dependencies = [
    "markdown-it-py>=3.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.15",
]

# The local embedder (D-013) and the vector query path. Deliberately optional:
# onnxruntime + tokenizers + numpy pull in twenty-odd packages, which is a large
# price to charge someone who only wants lexical search — and a build without
# them degrades to lexical rather than failing (ADR-0017).
[project.optional-dependencies]
embeddings = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]
# Watch mode (roadmap 3.5). A development convenience, so the filesystem watcher
# is opt-in too: an agent querying a published snapshot never needs it.
watch = ["watchdog>=4.0"]
# Ingestion of non-Markdown sources (roadmap 4.1, ADR-0032). Optional because the
# authored lane needs none of it, and *slim* because the full `docling` package
# pulls torch, torchvision, transformers, opencv and scipy — sixty-odd packages —
# and downgrades our own typer pin. The extras named here are the declarative
# backends plus PDFium: no ML weights, no HuggingFace download, no network, and
# deterministic on every platform in the CI matrix. pypdfium2 is listed in its own
# right because `mycelium.ingest.parsers.pdf` imports it directly.
#
# The pandoc fallback is deliberately absent: it is one external binary, installed
# by the operating system's package manager, not a Python dependency.
ingest = [
    "docling-slim[convert-core,format-docx,format-html,format-latex,format-pdf]>=2.124",
    "pypdfium2>=4.30",
    # The synthesis extra is a dev dependency so CI type-checks the provider
    # adapter on every platform. No test calls the API: the lane is exercised
    # against a scripted provider, and the one live smoke test skips without a key.
    "anthropic>=1.2",
]
# The LLM synthesis lane (roadmap 4.4, ADR-0035). Optional because the evidence
# lane — the deterministic one — needs none of it, and because a default install
# must make no network call at all (D-013/D-017): without a configured provider
# the lane does not run. Four packages, through the official SDK rather than a
# hand-rolled POST, because auth resolution, retry policy and a typed error
# hierarchy are three things not worth reimplementing.
synthesis = ["anthropic>=1.2"]
# Symbol extraction from code fences (roadmap 5.1, ADR-0073). Optional because the
# definition syntax for documentation needs none of it, and because a grammar is a
# compiled wheel per language: nine from the tree-sitter organisation, loaded through
# the one binding. Which of them is installed, and at which version, enters the build
# key, so the symbols a snapshot holds are a function of the corpus and of these
# versions - and a build without them compiles, says it is degraded, and names this
# extra. `tree-sitter>=0.25` is the release that moved matching onto `QueryCursor`;
# `<0.26` is a defect pin, not caution: 0.26.0 faults with an access violation while
# reading a fence of the vendored ingested corpus, deterministically, and takes the
# whole build process with it. 0.25.2 reads the same bytes repeatedly and produces
# byte-identical definitions ([BUG-0022], roadmap 5.2). Lift the pin only against a
# release that survives `uv run pytest -m determinism` plus a build of
# eval/corpora/uv-docs-ingested.
symbols = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.scripts]
mycelium = "mycelium.cli:main"

[project.urls]
# The links a registry expects, which `docs/workflow/packaging.md` has promised
# since M1 and the metadata did not carry: a reader on the index page could reach
# the repository and the issue tracker, and not the documentation or the
# changelog (roadmap 6.11).
Homepage = "https://github.com/danielPoloWork/mycelium-os"
Documentation = "https://github.com/danielPoloWork/mycelium-os/tree/main/docs-site"
Changelog = "https://github.com/danielPoloWork/mycelium-os/blob/main/CHANGELOG.md"
Source = "https://github.com/danielPoloWork/mycelium-os"
Issues = "https://github.com/danielPoloWork/mycelium-os/issues"
# `Documentation` points at the site's *sources* rather than at `mkdocs.yml`'s
# `site_url`, because nothing hosts the built site yet: 6.2 builds and checks it,
# and no workflow deploys it. It moves to the Pages URL in the change that starts
# publishing it, and not before — a dead documentation link on an index page is
# the same defect as the install line this item was filed to fix.

# BUG-0003 (ROADMAP.md 1.3): the group is now complete (hatch, pytest, pytest-benchmark,
# ruff, mypy) and uv.lock ships alongside it — this is what flips CI's bootstrap probe to
# ready=true, activating the build/lint/benchmark jobs.
[dependency-groups]
# The PDF renderer for `tools/build_ingested_corpus.py --render`, in a group of its own and
# deliberately **not** in `dev` (roadmap 5.27, ADR-0098). It is 62.5 MB installed — a whole
# typesetter in one wheel — and CI never renders: rendering is a one-time provenance act, and
# every job in the matrix would carry those bytes to run `--check`, which reads the committed
# PDFs and needs nothing. So a routine `uv sync --all-extras --dev` still removes it, by
# design, and one documented command puts it back:
#
#     uv sync --group render
#
# Pinned exactly, and to a version read out of the corpus rather than chosen: every committed
# PDF carries `Creator: Typst 0.15.0` in its own metadata, and
# `tests/test_eval_ingested_corpus.py` asserts the two agree, so the pin and the artifacts
# cannot drift apart. The bytes still are not reproducible — typst stamps a timestamp, measured
# at ADR-0039 — but the *typesetter* is, which is what governs layout and the text layer a
# parser reads back.
render = ["typst==0.15.0"]
dev = [
    "hatch>=1.13",
    "pytest>=8.3",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "mcp>=2.1",
    "anyio>=4",
    "jsonschema>=4",
    # Validates that the built distributions are *publishable* before anything is
    # published: `twine check --strict` renders the long description the way the
    # index will and fails on metadata an index would reject (roadmap 6.11). Run
    # by `tools/check_distribution.py`, in CI and in the publish workflow.
    "twine>=5.0",
    # The docs site (roadmap 6.2, ADR-0115): mkdocs-material renders it, and the two
    # generator plugins build the API reference and its nav from `mycelium.sdk`'s own
    # docstrings rather than a hand-maintained page — single source of truth, and the
    # quality-bar row "API docs build without warnings" (AGENTS.md §10) needs the build
    # on every platform CI runs.
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    # Renders the plugin cookiecutter (roadmap 6.2) in `tests/test_plugin_cookiecutter.py`,
    # and rendered output is checked with this repo's own ruff/mypy — a template that
    # cannot produce a clean plugin is not a template worth shipping.
    "cookiecutter>=2.6",
    # The embeddings extra is a dev dependency too, so CI type-checks and
    # exercises the vector path on every platform. Tests that need the *model*
    # files skip themselves when those are absent — CI does not download 133 MB.
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "watchdog>=4.0",
    # The ingest extra is a dev dependency for the same reason the embeddings one
    # is: CI type-checks and exercises the adapters on every platform. The pandoc
    # binary is installed by the workflow, and the tests that need it skip when it
    # is absent — a contributor without pandoc still runs everything else.
    # The contrib module, so CI exercises the plugin API on every platform and
    # `mypy --strict` reads it. A workspace member, so this is the working tree
    # rather than a release (roadmap 5.5).
    "mycelium-chats",
    "docling-slim[convert-core,format-docx,format-html,format-latex,format-pdf]>=2.124",
    "pypdfium2>=4.30",
    # The symbols extra is a dev dependency for the same reason again: CI exercises
    # every grammar on every platform, and gate G6's golden is blessed with them
    # installed - the gate refuses to run without them rather than compare a
    # degraded snapshot against it (roadmap 5.1).
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-typescript>=0.23",
]

# The contrib module is a distribution of its own (roadmap 5.5, ADR-0077), built
# and installed from the same working tree through a uv workspace. Two packages,
# one repository: the module is held to the published plugin API exactly as a
# third party would be, and is developed without a release cycle of its own.
[tool.uv.workspace]
members = ["contrib/*"]

[tool.uv.sources]
mycelium-chats = { workspace = true }
# The module depends on the core, and inside the workspace that dependency is
# this working tree rather than a release from the index — so a core change is
# visible to the module without a publish, which is what makes the plugin-API
# validation a live test rather than a version-lag one.
mycelium-os = { workspace = true }

[tool.hatch.version]
path = "src/mycelium/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mycelium"]

[tool.hatch.build.targets.sdist]
# An ALLOWLIST, and it replaced a one-line denylist for a reason worth keeping
# (roadmap 6.11, ADR-0116). `exclude = ["contrib"]` meant the sdist was "the
# working directory, minus contrib, minus whatever the root .gitignore names" —
# so the archive built at v0.5.0 carried 14.5 MB across 30 top-level entries,
# including:
#
#   - `.hypothesis/` — 1,248 files of a machine-local example database, ignored
#     by its own nested `.gitignore`, which hatchling does not read;
#   - `docs/analysis/` and `.claudeignore` — untracked working files that are not
#     gitignored, so whatever a maintainer had in progress shipped with the
#     release;
#   - `.eados-core/`, `.claude/`, `orchestrator/` — the delivery factory;
#   - `eval/` — 2.7 MB of judged corpora, including documentation this project
#     did not write.
#
# Two of those are defects rather than bloat: a published version is immutable, so
# an artifact whose contents depend on the builder's working tree cannot be
# reproduced, and an in-progress document that reaches a registry cannot be
# recalled. A denylist cannot fix that, because it has to predict what will be
# lying around; an allowlist states what a source distribution *is*.
#
# What it is: the package, the files needed to build it, and the ones that state
# its terms. `tests/` is deliberately absent — the suite reads `eval/corpora`,
# `tests/fixtures`, a pandoc binary, nine tree-sitter grammars and (for two
# tests) a 133 MB model, so shipping tests that cannot run is worse than not
# shipping them. They are one `git clone` away, and the metadata links the
# repository. Revisit if a downstream packager ever needs to build from the sdist
# and verify it.
include = [
    "/src/mycelium",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests", "contrib/chats/tests"]
markers = [
    "determinism: gate G6 — byte-identical rebuild against the committed golden corpus",
    "embeddings: needs the local model files; skipped when they are not on this machine",
    "pandoc: needs the pandoc binary on PATH; skipped when it is not installed",
    "llm: calls a real LLM provider; skipped unless a credential is configured",
    "inventory: the M4 exit gate — zero silent element loss on the ingestion corpus",
    "boundary(id): the threat-model trust boundary this test holds — `pytest -m boundary` is the threat-model-derived suite (roadmap 6.3)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# `force-exclude` makes `extend-exclude` bind even when `tools` is passed as an
# explicit path (as `tools/verify.py` and CI both do) — without it ruff only
# honours excludes while discovering files itself (roadmap 6.2).
force-exclude = true
extend-exclude = ["tools/cookiecutter-mycelium-plugin"]

[tool.ruff.format]
# Black-compatible (AGENTS.md §10); default quote/indent style already matches.
#
# Fixture Markdown is excluded because it is *input bytes*, not source: `ruff format`
# reformats Python inside Markdown code fences, so without this it would rewrite a
# committed fixture and move the digests the ingestion tests assert — a formatter
# breaking a test by doing its job. The generator that writes them stays formatted.
exclude = ["tests/fixtures/**/*.md"]

[tool.ruff.lint.isort]
# `mycelium_chats` is the contrib module (roadmap 5.5): a separate distribution
# in this workspace, so ruff would otherwise sort it as a third party and put it
# above `mycelium`. Naming both keeps one import order across the two trees.
known-first-party = ["mycelium", "mycelium_chats"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "contrib/chats/src", "tests", "contrib/chats/tests"]

# `tests/` joined at roadmap 6.9, under the same `strict` as everything else, because
# the measurement found no useful setting between the two (ADR-0124). The errors a
# non-strict override would have kept — `arg-type`, `union-attr`, `attr-defined` — are
# mypy's *base* checks and are on at every strictness; what such an override would have
# turned off is `disallow_untyped_defs`, and an unannotated test function is one mypy
# does not check the body of at all. So the choice was all or nothing, and the errors
# it surfaced were nearly all real looseness rather than deliberate invalidity.

# Where a test *does* feed an invalid value on purpose, the per-line `# type: ignore[...]`
# is the vocabulary for saying so, and it documents the intent at the site rather than in
# a settings file that covers every test equally.

mypy_path = ["tools"]
# `tests/` imports `verify`, `consistency_lint` and `update_journal_index` to hold the
# tools to their own contracts. They reach them through a `sys.path` insertion, which is
# a runtime trick mypy cannot see — so the path is declared here instead of the imports
# being ignored (roadmap 6.9).
# The plugin cookiecutter (roadmap 6.2) renders real, checked Python — Jinja
# substitutions live only inside string literals and TOML values, never in
# identifier or control-flow position — but its own `{{ cookiecutter.* }}`
# placeholder directory names are not a package mypy can import, so the
# template tree itself is excluded here the same way ruff excludes it above.
# What the template *produces* is checked by rendering it, in
# `tests/test_plugin_cookiecutter.py`.
exclude = ["^tools/cookiecutter-mycelium-plugin/"]

# Optional dependencies loaded behind a runtime guard, none of which ship stubs. Their
# surface is narrow and checked by tests instead.
#
# `typst` is the odd one and the reason this list grew at roadmap 4.43. It is now *declared*
# — the `render` dependency group above, pinned (roadmap 5.27, ADR-0098) — but it is still
# not installed by `uv sync --all-extras --dev`, so it is present on a machine that has
# rendered the PDF fixtures and absent everywhere else, including CI. The override stays for
# that reason and not for the old one: the asymmetry is deliberate now rather than an
# omission. It is worth stating rather than smoothing, because `mypy --strict tools` passed
# locally and failed in CI on this one import — the local loop is a superset of CI only where
# the two environments agree (ADR-0071).
[[tool.mypy.overrides]]
module = [
    "onnxruntime.*",
    "tokenizers.*",
    "watchdog.*",
    "docling.*",
    "pypdfium2.*",
    "typst.*",
    # Test-only, and here for the same reason as the rest: neither ships stubs, and
    # both are exercised at two call sites whose surface a test already asserts
    # (roadmap 6.9). `cookiecutter` renders the plugin template; `jsonschema` validates
    # the MCP tool schemas against their dialect.
    "cookiecutter.*",
    "jsonschema.*",
]
ignore_missing_imports = true
