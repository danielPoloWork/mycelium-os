[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycelium-os"
dynamic = ["version"]
description = "The knowledge compiler for AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Daniel Polo" }]
# Runtime closure, kept deliberately small and offline (D-013/D-017):
#   pydantic       — the record contracts, pinned by the spec (ADR-0004); >=2.11 for
#                    the `serialize_by_alias` model config.
#   markdown-it-py — CommonMark + the rule pipeline the profile extends (ADR-0006).
#   PyYAML         — frontmatter (ADR-0006 records the YAML 1.1 caveat).
dependencies = [
    "markdown-it-py>=3.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.15",
]

# The local embedder (D-013) and the vector query path. Deliberately optional:
# onnxruntime + tokenizers + numpy pull in twenty-odd packages, which is a large
# price to charge someone who only wants lexical search — and a build without
# them degrades to lexical rather than failing (ADR-0017).
[project.optional-dependencies]
embeddings = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]
# Watch mode (roadmap 3.5). A development convenience, so the filesystem watcher
# is opt-in too: an agent querying a published snapshot never needs it.
watch = ["watchdog>=4.0"]
# Ingestion of non-Markdown sources (roadmap 4.1, ADR-0032). Optional because the
# authored lane needs none of it, and *slim* because the full `docling` package
# pulls torch, torchvision, transformers, opencv and scipy — sixty-odd packages —
# and downgrades our own typer pin. The extras named here are the declarative
# backends plus PDFium: no ML weights, no HuggingFace download, no network, and
# deterministic on every platform in the CI matrix. pypdfium2 is listed in its own
# right because `mycelium.ingest.parsers.pdf` imports it directly.
#
# The pandoc fallback is deliberately absent: it is one external binary, installed
# by the operating system's package manager, not a Python dependency.
ingest = [
    "docling-slim[convert-core,format-docx,format-html,format-latex,format-pdf]>=2.124",
    "pypdfium2>=4.30",
    # The synthesis extra is a dev dependency so CI type-checks the provider
    # adapter on every platform. No test calls the API: the lane is exercised
    # against a scripted provider, and the one live smoke test skips without a key.
    "anthropic>=1.2",
]
# The LLM synthesis lane (roadmap 4.4, ADR-0035). Optional because the evidence
# lane — the deterministic one — needs none of it, and because a default install
# must make no network call at all (D-013/D-017): without a configured provider
# the lane does not run. Four packages, through the official SDK rather than a
# hand-rolled POST, because auth resolution, retry policy and a typed error
# hierarchy are three things not worth reimplementing.
synthesis = ["anthropic>=1.2"]

[project.scripts]
mycelium = "mycelium.cli:main"

[project.urls]
Homepage = "https://github.com/danielPoloWork/mycelium-os"
Issues = "https://github.com/danielPoloWork/mycelium-os/issues"

# BUG-0003 (ROADMAP.md 1.3): the group is now complete (hatch, pytest, pytest-benchmark,
# ruff, mypy) and uv.lock ships alongside it — this is what flips CI's bootstrap probe to
# ready=true, activating the build/lint/benchmark jobs.
[dependency-groups]
dev = [
    "hatch>=1.13",
    "pytest>=8.3",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "mcp>=2.1",
    "anyio>=4",
    "jsonschema>=4",
    # The embeddings extra is a dev dependency too, so CI type-checks and
    # exercises the vector path on every platform. Tests that need the *model*
    # files skip themselves when those are absent — CI does not download 133 MB.
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "watchdog>=4.0",
    # The ingest extra is a dev dependency for the same reason the embeddings one
    # is: CI type-checks and exercises the adapters on every platform. The pandoc
    # binary is installed by the workflow, and the tests that need it skip when it
    # is absent — a contributor without pandoc still runs everything else.
    "docling-slim[convert-core,format-docx,format-html,format-latex,format-pdf]>=2.124",
    "pypdfium2>=4.30",
]

[tool.hatch.version]
path = "src/mycelium/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mycelium"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
markers = [
    "determinism: gate G6 — byte-identical rebuild against the committed golden corpus",
    "embeddings: needs the local model files; skipped when they are not on this machine",
    "pandoc: needs the pandoc binary on PATH; skipped when it is not installed",
    "llm: calls a real LLM provider; skipped unless a credential is configured",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# Black-compatible (AGENTS.md §10); default quote/indent style already matches.
#
# Fixture Markdown is excluded because it is *input bytes*, not source: `ruff format`
# reformats Python inside Markdown code fences, so without this it would rewrite a
# committed fixture and move the digests the ingestion tests assert — a formatter
# breaking a test by doing its job. The generator that writes them stays formatted.
exclude = ["tests/fixtures/**/*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

# onnxruntime and tokenizers ship no stubs; they are optional dependencies loaded
# behind a runtime guard, so their surface is narrow and checked by tests instead.
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "tokenizers.*", "watchdog.*", "docling.*", "pypdfium2.*"]
ignore_missing_imports = true
