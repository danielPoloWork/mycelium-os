# Canonical label set for mycelium-os (generated by EADOS).
# One type-label per PR matching the lead commit's Conventional-Commit type (AGENTS.md §6.4).
# Sync these with the gh snippet in docs/workflow/github-setup.md.
- name: feat
  color: "0e8a16"
  description: "A new feature"
- name: fix
  color: "d73a4a"
  description: "A bug fix"
- name: refactor
  color: "fbca04"
  description: "Behavior-preserving restructuring"
- name: perf
  color: "5319e7"
  description: "A performance improvement"
- name: docs
  color: "0075ca"
  description: "Documentation only"
- name: test
  color: "bfd4f2"
  description: "Tests only"
- name: build
  color: "c5def5"
  description: "Build system or dependencies"
- name: chore
  color: "ededed"
  description: "Maintenance with no src/test change"
- name: ci
  color: "1d76db"
  description: "CI configuration"
- name: security
  color: "b60205"
  description: "Security fix or advisory"

# The two contribution-ladder labels (roadmap 6.6, ADR-0117). They are not PR type
# labels — they go on *issues*, and they exist because an invitation nobody can act
# on is not an invitation.
#
# Both existed on GitHub as stock labels and neither was declared here, which is the
# small version of the finding this item was built on: a manifest that calls itself
# canonical while the live repository carries labels it never heard of is not
# canonical. Declared now, with the descriptions this project means rather than the
# ones GitHub ships.
- name: good first issue
  color: "7057ff"
  # The description is the promise, and AGENTS.md §6.1 is where it binds: an item
  # carrying this label is **reserved**, and the agent pipeline does not take it.
  # Without that rule the label is a trap — this repository closed 43 items in five
  # days at M5, so anything a newcomer took a week to reach would already be merged.
  description: "Reserved for a first-time contributor — the agent pipeline will not take it"
- name: help wanted
  color: "008672"
  description: "Open for anyone to pick up; the maintainer is not working on it"

# The trigger label (roadmap 7.5, ADR-0155). Applied by the *I cannot use MCP or the
# CLI* issue form and by nothing else on purpose: spec 06 §3 defers an HTTP API until
# "a consumer that cannot use MCP/CLI actually appears", and the form is how one
# appears. `tools/adoption_report.py` recognises the form by its field headings, not by
# this label - a label is one click for anyone with triage rights - so the label is for
# the humans reading the tracker, and the form is the evidence.
- name: surface-request
  color: "e99695"
  description: "A consumer that cannot use MCP or the CLI, filed through the form (spec 06 §3)"
