name: ci

# Enterprise CI gate for mycelium-os, generated by EADOS.
# Implements the quality bar in AGENTS.md §10 across the toolchain matrix from the
# language profile. The build/test/format/lint commands come from project.yaml; the
# setup steps and language-specific extra jobs come from the profile.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel a run on main (its history matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Bootstrap guard (#313). Roadmap item 1.1 lays down the build system; until it lands there
  # is nothing for the toolchain jobs to build, so they SKIP rather than fail. A wall of red on
  # the bootstrap PR is not just noise — it teaches that red CI on this repo is normal, which is
  # the opposite of what every other gate here is for.
  #
  # The probe needs BOTH signals, not just the build manifest: every toolchain job below
  # invokes hatch / pytest / ruff / mypy, and those reach the runner only through `uv sync`
  # — that is, only once the dev toolchain is declared AND locked (roadmap 1.2 + 1.3).
  # `pyproject.toml` alone lands at 1.1 with an empty dev toolchain, so gating on it made
  # the jobs fail with `command not found` instead of skipping. The moment `uv.lock` is
  # committed every job below runs for real, with no edit to this workflow or to the profile.
  # ---------------------------------------------------------------------------
  bootstrap:
    name: bootstrap / is the toolchain in place?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # the mode is derived from a diff against the base
      # Which gates this change needs, derived from what it touches (roadmap 4.31,
      # ADR-0055). A pull request runs the gates its diff implicates; everything
      # else - a push to `main`, a release tag, a called workflow - runs the lot,
      # because the mode is an economy on the *proposal* and never on the record.
      #
      # `tools/verify.py` is the same derivation a contributor runs locally, so
      # what CI decided and what they saw cannot drift: one implementation, two
      # callers.
      #
      # The *plan* was a second implementation with one name, and it did drift:
      # at `retrieval` the `eval` job below gated three corpora and the local
      # tool gated one, so passing the local loop did not mean passing this
      # (roadmap 4.35). `tests/test_verify_ladder.py` reads this file and
      # `verify.py` and fails when a job gates something the local plan skips —
      # so the duplication is checked rather than coincidental (ADR-0059).
      - id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            mode=$(python3 tools/verify.py --json --base "${{ github.event.pull_request.base.sha }}"                    | python3 -c 'import json,sys; print(json.load(sys.stdin)["mode"])')
          else
            mode=full
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "::notice title=Verification mode::$mode"
      - id: probe
        shell: bash
        run: |
          # compgen -G matches a literal name AND a glob, so a profile may declare either.
          if compgen -G "pyproject.toml" > /dev/null && [ -f uv.lock ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bootstrap pending::The dev toolchain is not installable yet (needs both pyproject.toml and a committed uv.lock), so the toolchain jobs are skipped. They start running by themselves once roadmap items 1.2 + 1.3 declare and lock ruff, mypy, pytest and hatch."
          fi

  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix (from the language profile).
  # ---------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.preset }}
    needs: bootstrap
    # A documentation-only change cannot move this, so it does not run it
    # (roadmap 4.31). The matrix itself is *not* narrowed further by mode:
    # a pure-Python change is exactly the kind that breaks on Windows and
    # not on Linux, which this repository has already paid for once (the
    # drive-letter path bug at 4.1).
    if: needs.bootstrap.outputs.ready == 'true' && needs.bootstrap.outputs.mode != 'docs'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: python-3.12, preset: test }
          - { os: ubuntu-24.04, toolchain: python-3.13, preset: test }
          - { os: windows-2022, toolchain: python-3.12, preset: test }
          - { os: macos-14, toolchain: python-3.12, preset: test }
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.toolchain == 'python-3.13' && '3.13' || '3.12' }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies
        run: uv sync --all-extras --dev

      # The pandoc parser (roadmap 4.1) drives an external binary over a
      # subprocess, and subprocess behaviour is exactly what differs between
      # Windows and the Unix runners — so it is installed on every cell rather
      # than on one. The tests that need it skip when it is absent, which is what
      # a contributor without pandoc sees; CI does not get to skip them.
      - name: Install pandoc
        uses: ./.github/actions/setup-pandoc

      - name: Build
        shell: bash
        run: uv run hatch build

      # `--hypothesis-show-statistics` is on here and nowhere else: this is the
      # only job that runs the property tests (the others select by marker), and
      # roadmap 4.29 was filed because one of them failed once and left nothing
      # to look at. The statistics block reports per-example runtimes against the
      # profile's deadline, so the next occurrence can be read rather than
      # guessed at.
      - name: Test
        shell: bash
        run: uv run pytest -q --hypothesis-show-statistics

      # The falsifying example, kept. Hypothesis writes it into `.hypothesis/`,
      # which a fresh checkout throws away — so on a red run it is uploaded and
      # can be replayed locally with `HYPOTHESIS_PROFILE=debug`.
      #
      # Deliberately an artifact and NOT `actions/cache`: a cached example
      # database would let a *previous* run decide this one's result, and "same
      # commit, different answer" is the property this repository gates against
      # (NFR-1, gate G6). Losing the cross-run replay is the price; the artifact
      # keeps the diagnosis, which is what 4.29 asked for.
      - name: Keep the falsifying example
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hypothesis-examples-${{ matrix.os }}-${{ matrix.toolchain }}
          path: .hypothesis/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Cross-artifact congruence — the agent-runnable consistency lint.
  # ---------------------------------------------------------------------------
  consistency:
    name: consistency / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # i18n/version checks need full history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run the consistency lint
        run: python tools/consistency_lint.py

  # ---------------------------------------------------------------------------
  # Language-specific quality jobs (format, lint, sanitizers, …) from the profile.
  # ---------------------------------------------------------------------------
  lint:
    name: lint / ruff + mypy
    runs-on: ubuntu-24.04
    needs: bootstrap
    # A documentation-only change cannot move this, so it does not run it
    # (roadmap 4.31). The matrix itself is *not* narrowed further by mode:
    # a pure-Python change is exactly the kind that breaks on Windows and
    # not on Linux, which this repository has already paid for once (the
    # drive-letter path bug at 4.1).
    if: needs.bootstrap.outputs.ready == 'true' && needs.bootstrap.outputs.mode != 'docs'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras --dev
      # `tools` joined at roadmap 4.43, priced at zero: the eighteen files that build
      # the ingested corpus, carry the judgements, measure the ranking and decide gate
      # G2's currency were reviewed and checked by nothing. `tests/test_verify_ladder.py`
      # asserts this line and tools/verify.py's plan name the same paths.
      # The path lists are `tools/verify.py`'s CHECKED_PATHS and TYPED_PATHS, and
      # `tests/test_verify_ladder.py` fails when this line and that file disagree
      # (ADR-0059). `contrib/` joined at roadmap 5.5 with the first module.
      - run: uv run ruff format --check src tests tools contrib && uv run ruff check src tests tools contrib && uv run mypy --strict src tools contrib/chats/src

  # ---------------------------------------------------------------------------
  # Gate G6 — byte-identical rebuild (spec 04 §7, D-008). The determinism tests also
  # run inside the build matrix on all three operating systems, which is where
  # cross-platform reproducibility is actually proven; this job exists so the gate
  # is legible by name in the checks list rather than buried in a suite of 380.
  # ---------------------------------------------------------------------------
  determinism:
    name: determinism / gate G6
    needs: bootstrap
    # A documentation-only change cannot move this, so it does not run it
    # (roadmap 4.31). The matrix itself is *not* narrowed further by mode:
    # a pure-Python change is exactly the kind that breaks on Windows and
    # not on Linux, which this repository has already paid for once (the
    # drive-letter path bug at 4.1).
    if: needs.bootstrap.outputs.ready == 'true' && needs.bootstrap.outputs.mode != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Byte-identical rebuild against the committed golden corpus
        shell: bash
        run: uv run pytest -m determinism -q

  # ---------------------------------------------------------------------------
  # Roadmap 4.1-4.2 — the ingestion lane, run against real engines and real hostile
  # files. The suite also runs inside the build matrix (which is where
  # cross-platform subprocess behaviour is proven); this job exists so "did
  # docling and pandoc actually parse something, and did the hostile suite still
  # fail fast" is legible by name in the checks list, the same reason the
  # determinism job exists.
  # ---------------------------------------------------------------------------
  ingest:
    name: ingest / lanes
    needs: bootstrap
    # A documentation-only change cannot move this, so it does not run it
    # (roadmap 4.31). The matrix itself is *not* narrowed further by mode:
    # a pure-Python change is exactly the kind that breaks on Windows and
    # not on Linux, which this repository has already paid for once (the
    # drive-letter path bug at 4.1).
    if: needs.bootstrap.outputs.ready == 'true' && needs.bootstrap.outputs.mode != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Install pandoc
        uses: ./.github/actions/setup-pandoc
      - name: Both lanes — connector, parsers, custody, hostile suite, and synthesis
        shell: bash
        # The synthesis suite runs here with no credential configured, which is the
        # point: every rule the lane enforces is decided around a scripted provider,
        # and the one test that calls the real API skips itself. CI proves the
        # contract; a live key proves the request shape (ADR-0035).
        run: |
          uv run pytest -q \
            tests/test_sdk_protocols.py \
            tests/test_ingest_media.py \
            tests/test_ingest_connector.py \
            tests/test_ingest_registry.py \
            tests/test_ingest_parsers.py \
            tests/test_ingest_custody.py \
            tests/test_ingest_pipeline.py \
            tests/test_ingest_hostile.py \
            tests/test_synthesis_citations.py \
            tests/test_synthesis_wiki.py \
            tests/test_synthesis_lane.py \
            tests/test_synthesis_provider.py
      - name: The third corpus still matches a fresh ingestion of its sources
        shell: bash
        # The judged corpus at eval/corpora/uv-docs-ingested is committed *evidence* —
        # what the projector wrote from what the parsers read. This re-ingests the
        # committed binaries and compares, so a change in docling, pandoc, PDFium or
        # the projector shows up here rather than as a corpus that quietly stopped
        # matching its own provenance (roadmap 4.10, ADR-0039).
        run: uv run python tools/build_ingested_corpus.py --check
      - name: ...and its carried judgements still derive from that corpus
        shell: bash
        # The other half. The corpus check above proves the *documents* still match
        # their sources; this proves the judgements carried onto them still derive
        # from the frozen ones. They stopped once, silently, because the generator
        # inherited a store built under a different chunking policy — the sets were
        # then four cases smaller than committed and nothing said so (BUG-0018,
        # roadmap 4.16). A derived artifact whose generator no longer reproduces it
        # is a defect, not a cue to regenerate.
        run: uv run python tools/build_ingested_cases.py --check

  # ---------------------------------------------------------------------------
  # The M4 exit gate — zero *silent* element loss on the ingestion corpus
  # (roadmap 4.7, ADR-0038). Named separately from `ingest / lanes` for the same
  # reason `determinism / gate G6` is named separately from the build matrix: a
  # gate a milestone is measured against should be legible by name in the checks
  # list rather than buried in a suite.
  #
  # The declaration half of the corpus is hand-authored, so this job is checking a
  # claim a person made about a document, not a tool checking itself.
  # ---------------------------------------------------------------------------
  inventory:
    name: inventory / zero silent element loss
    needs: bootstrap
    # A documentation-only change cannot move this, so it does not run it
    # (roadmap 4.31). The matrix itself is *not* narrowed further by mode:
    # a pure-Python change is exactly the kind that breaks on Windows and
    # not on Linux, which this repository has already paid for once (the
    # drive-letter path bug at 4.1).
    if: needs.bootstrap.outputs.ready == 'true' && needs.bootstrap.outputs.mode != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Install pandoc
        uses: ./.github/actions/setup-pandoc
      - name: Every element declared, accounted for by every route
        shell: bash
        run: uv run pytest -m inventory -q

  # ---------------------------------------------------------------------------
  # Gates G1-G6 — the evaluation gates spec 04 §7.3 makes CI-enforced (roadmap 3.7).
  #
  # The repository is its own corpus, so the job compiles it and scores the judged
  # set against the snapshot it just published. `mycelium.toml` says which of this
  # tree's Markdown is documentation; without that the corpus would include test
  # fixtures and gate G4 would fail against a fixture (BUG-0007).
  #
  # Every build here is `--no-pin` (roadmap 4.14). A pinning build writes a
  # `mycelium_id` into each document that has none and mints a *fresh* one each
  # run, so the two unpinned corpora on this job — this repository (105 documents)
  # and `uv-docs-ingested` (82) — folded a different manifest on every run. That
  # the checkout is thrown away made it harmless, not reproducible. Path-derived
  # identities make a CI build of an unpinned corpus repeatable, which is what
  # comparing two runs requires (ADR-0046).
  # ---------------------------------------------------------------------------
  eval:
    name: eval / gates G1-G6
    needs: bootstrap
    # The gates read the corpora and the judged sets, so they run when the
    # change can move either — and always on `main` and on a tag, where the
    # mode is `full` by construction (roadmap 4.31).
    if: >-
      needs.bootstrap.outputs.ready == 'true'
      && (needs.bootstrap.outputs.mode == 'retrieval' || needs.bootstrap.outputs.mode == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the frozen-set check diffs against the base branch
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: A change may tune retrieval or re-judge the release set, not both
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          uv run python tools/check_frozen_release_sets.py "${{ github.event.pull_request.base.sha }}"
      # `--no-pin` (roadmap 4.14) rather than a thrown-away checkout. Two reasons,
      # and the second is the important one: a pinning build would write a
      # `mycelium_id` into every document that lacks one — 105 of them in this
      # repository — and it would mint a *fresh* one on every run, so two CI runs
      # would measure two different corpora. Path-derived identities make the
      # build reproducible, which is the precondition for comparing anything.
      - name: Compile this repository's own documentation
        shell: bash
        run: uv run mycelium build . --no-pin
      - name: Compile the second corpus (documentation we did not write)
        shell: bash
        run: uv run mycelium build eval/corpora/uv-docs --no-pin
      # `--against grep` on every corpus (roadmap 4.8). The incumbent's numbers are
      # computed inside the run — same snapshot, same cases, same anchor space — and
      # land in the run manifest spec 04 §7.5 already requires. Reported, never
      # gated: §7.4 quantifies the gate at 1.0 (roadmap 6.4), and a baseline that
      # could fail the build is a baseline nobody dares improve. On *every* corpus
      # because the finding 4.8 recorded lived on the second one, which this job
      # never compared — which is why nobody saw the gap close (ADR-0049).
      - name: Gates G1-G6 on the frozen release set — this corpus
        shell: bash
        run: uv run mycelium eval . --gate --against grep
      - name: Gates G1-G6 on the frozen release set — the second corpus
        shell: bash
        run: uv run mycelium eval eval/corpora/uv-docs --set eval/release.jsonl --gate --against grep
      - name: Compile the third corpus (the second one, ingested)
        shell: bash
        run: uv run mycelium build eval/corpora/uv-docs-ingested --no-pin
      - name: Gates G1-G6 on the frozen release set — the ingested corpus
        shell: bash
        run: uv run mycelium eval eval/corpora/uv-docs-ingested --set eval/release.jsonl --gate --against grep
      # Gate G2's runner, and the first one it has ever had (roadmap 4.40). CI
      # cannot *re-measure* G2 — the hybrid arm needs the 133 MB embedding model
      # and D-013 downloads nothing unless configured — so what it checks is that
      # the committed verdict still describes this product: the same retrieval
      # configuration, the same vendored corpora, the same judgements. Every one
      # of the four lexical changes that moved the verdict underneath itself
      # (packing, stemming, function-word stripping, the heading split) moves one
      # of those, so each would have failed here and asked for a re-measurement.
      #
      # It does *not* fail because hybrid lost: "ship lexical-only" is a legitimate
      # G2 outcome and a gate that were red on the shipped configuration is a gate
      # everyone learns to ignore (ADR-0068).
      - name: Gate G2's recorded verdict still describes this product
        shell: bash
        run: uv run python tools/measure_hybrid_gate.py --check
      # Spec 04 §5's ablation decides whether graph expansion ships on, and it
      # needs no embedding model, so unlike G2 it can be *re-measured* here
      # rather than merely dated. It fails when the shipped flag disagrees with
      # the measurement, never because the ablation was lost - "stays opt-in" is
      # the recorded outcome (roadmap 5.3, ADR-0075).
      - name: Graph expansion ships the default its ablation supports
        shell: bash
        run: uv run python tools/measure_graph_expansion.py --check
      # Spec 04 §3's symbol leg, on the same terms (roadmap 5.9, ADR-0076): it
      # needs no model, it is deterministic, and "stays opt-in" is the recorded
      # outcome rather than a failure.
      - name: The symbol leg ships the default its ablation supports
        shell: bash
        run: uv run python tools/measure_symbol_leg.py --check
      - name: What projection costs, for the record (roadmap 4.10)
        shell: bash
        # Reported, never gated: with two to five cases per format there is no
        # threshold anyone could defend, and a gate nobody believes is a gate
        # everyone re-blesses (ADR-0039).
        run: uv run python tools/measure_projection_cost.py || true
      - name: The grep baseline in full, for the record (D-010)
        shell: bash
        # The comparison above is one line per corpus; this is the incumbent's own
        # run with its per-slice table, which is what a reader needs when that line
        # says a slice is still conceded.
        run: uv run mycelium eval . --retriever grep || true
      - name: Agent-task suite against the grep loop
        shell: bash
        run: uv run mycelium eval . --tasks

  # Reproducible performance gate — runs only when the project has a benchmark suite.
  benchmark:
    name: benchmark / reproducible perf
    needs: bootstrap
    # Timings are only worth recording against a full run (roadmap 4.31).
    if: needs.bootstrap.outputs.ready == 'true' && needs.bootstrap.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # This job has no matrix — pin the floor interpreter explicitly so benchmark
          # numbers stay comparable run over run (NFR-1 determinism).
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Run the benchmark suite
        shell: bash
        run: uv run pytest tests/bench contrib/chats/tests/bench --benchmark-only


