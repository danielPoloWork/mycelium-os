name: ci

# Enterprise CI gate for mycelium-os, generated by EADOS.
# Implements the quality bar in AGENTS.md §10 across the toolchain matrix from the
# language profile. The build/test/format/lint commands come from project.yaml; the
# setup steps and language-specific extra jobs come from the profile.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel a run on main (its history matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Bootstrap guard (#313). Roadmap item 1.1 lays down the build system; until it lands there
  # is nothing for the toolchain jobs to build, so they SKIP rather than fail. A wall of red on
  # the bootstrap PR is not just noise — it teaches that red CI on this repo is normal, which is
  # the opposite of what every other gate here is for. The moment `pyproject.toml` exists
  # every job below runs for real, with no edit to this workflow or to the profile.
  # ---------------------------------------------------------------------------
  bootstrap:
    name: bootstrap / is the build system in place?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: probe
        shell: bash
        run: |
          # compgen -G matches a literal name AND a glob, so a profile may declare either.
          if compgen -G "pyproject.toml" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bootstrap pending::pyproject.toml is not present yet, so the toolchain jobs are skipped. They start running by themselves once roadmap item 1.1 lands the build system."
          fi

  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix (from the language profile).
  # ---------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.preset }}
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: python-3.12, preset: test }
          - { os: ubuntu-24.04, toolchain: python-3.13, preset: test }
          - { os: windows-2022, toolchain: python-3.12, preset: test }
          - { os: macos-14, toolchain: python-3.12, preset: test }
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.toolchain == 'python-3.13' && '3.13' || '3.12' }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Build
        shell: bash
        run: hatch build

      - name: Test
        shell: bash
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Cross-artifact congruence — the agent-runnable consistency lint.
  # ---------------------------------------------------------------------------
  consistency:
    name: consistency / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # i18n/version checks need full history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run the consistency lint
        run: python tools/consistency_lint.py

  # ---------------------------------------------------------------------------
  # Language-specific quality jobs (format, lint, sanitizers, …) from the profile.
  # ---------------------------------------------------------------------------
  lint:
    name: lint / ruff + mypy
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras --dev
      - run: ruff format --check . && ruff check . && mypy --strict src

  # Reproducible performance gate — runs only when the project has a benchmark suite.
  benchmark:
    name: benchmark / reproducible perf
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.toolchain == 'python-3.13' && '3.13' || '3.12' }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Run the benchmark suite
        shell: bash
        run: pytest tests/bench --benchmark-only


