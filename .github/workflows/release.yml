name: release

# Release workflow for mycelium-os, generated by EADOS.
# Fires on an annotated SemVer tag push and prepares a *draft* GitHub Release. Publishing is
# the deliberate human checkpoint (AGENTS.md §11 / docs/workflow/release.md) — this workflow
# never publishes, it only drafts so a maintainer can review and press "Publish".
#
# BUG-0006: the draft used to be created without the distribution attached — the build step
# proved the tag compiled and then threw the wheel away, so every release shipped with zero
# assets while docs/workflow/release.md promised "CI builds & attaches artifacts". The
# `files:` input below is the attachment; the `workflow_dispatch` trigger is how an existing
# tag gets re-drafted without moving it, which is what a tag pushed before this fix needs.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-draft, e.g. v0.2.0 (runs from the default branch)"
        required: true
        type: string

# `contents: write` drafts the release. The other two are what make the artifacts
# verifiable (roadmap 6.6, ADR-0117): `id-token: write` lets the runner ask GitHub for
# the OIDC token Sigstore signs with, and `attestations: write` lets it store the
# result. There is still no key and no secret anywhere — the same property publishing
# has (ADR-0116), for the same reason: a signing key in repository secrets is a thing
# to leak, rotate and misplace, and threat boundary B2 would have to cover it.
permissions:
  contents: write
  id-token: write
  attestations: write

# Serialize per-tag, but NEVER cancel an in-flight release — a half-run publish is worse
# than a queued one.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    name: draft GitHub Release for ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # On a tag push this is the tag that fired the run; on a manual dispatch it is the tag
      # named in the input, so a re-draft never depends on which ref the workflow ran from.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # BUG-0001: this job has no matrix — pin the interpreter literally.
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Build (verify the tag builds clean)
        shell: bash
        # `uv sync` installs into .venv without putting it on PATH — invoke through `uv run`
        # or the tag build dies with `hatch: command not found` (BUG-0002).
        run: uv run hatch build

      - name: Verify the built version equals the tag
        shell: bash
        # The packaging invariant (docs/workflow/packaging.md): the distributed version
        # equals the tag and the version constant. Checking it here means a tag pushed
        # without a version bump fails loudly instead of drafting a release whose assets
        # disagree with its name.
        run: |
          expected="${RELEASE_TAG#v}"
          echo "tag says: $expected"
          # Exported because the SBOM step below names the file by version, and deriving
          # the same string twice in two places is how the two come to disagree.
          echo "EXPECTED_VERSION=$expected" >> "$GITHUB_ENV"
          ls -1 dist/
          for artifact in dist/*; do
            case "$(basename "$artifact")" in
              mycelium_os-"$expected"-*.whl|mycelium_os-"$expected".tar.gz) ;;
              *)
                echo "::error::$(basename "$artifact") does not carry version $expected"
                exit 1
                ;;
            esac
          done

      - name: Build the SBOM of the wheel this release ships
        shell: bash
        # The generator runs in an environment of its own (`uv tool run`) and is never
        # installed into this project's, because installing it changed what the compiler
        # produces: it pulls `chardet`, BeautifulSoup binds to it when importable, and
        # five HTML projections in the ingested corpus moved (ADR-0117).
        #
        # `--wheel` points it at the artifact built above rather than letting it build
        # its own: the SBOM, the provenance and the upload have to be statements about
        # the same bytes, and a second build is a second set of bytes however identical
        # it ought to be. `--extras all` because a consumer who enables an extra is
        # entitled to the same answer as one who does not; the default install is what
        # CI builds on every push.
        run: |
          uv run python tools/build_sbom.py \
            --extras all \
            --wheel "$(ls dist/*.whl)" \
            --out sbom

      - name: Attest the build provenance of the artifacts
        # SLSA provenance, signed through Sigstore with a short-lived OIDC identity and
        # recorded in GitHub's attestation store: it says these exact bytes were built by
        # this workflow, from this repository, at this commit. A consumer checks it with
        #
        #     gh attestation verify <file> --repo danielPoloWork/mycelium-os
        #
        # which is the sentence docs/workflow/packaging.md now carries — an attestation
        # nobody is told how to check is decoration.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest the SBOM against the wheel
        # Distinct from the provenance above and worth both: provenance says where the
        # artifact came from, this says what is inside it, and binds the SBOM to the
        # wheel's digest so an SBOM cannot be swapped for a friendlier one.
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.whl
          sbom-path: sbom/mycelium_os-${{ env.EXPECTED_VERSION }}.all-extras.cdx.json

      - name: Draft the release with its artifacts (a human publishes it)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          # The SBOM is attached beside the archives rather than left in the attestation
          # store alone: a reader deciding whether to install this should be able to read
          # the dependency list without a CLI and without an account.
          files: |
            dist/*
            sbom/*.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
