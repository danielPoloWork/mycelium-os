name: Set up pandoc
description: >-
  Install a pinned pandoc from its official release archive, verified by digest,
  on every runner in the matrix.

# Why not the package managers.
#
# Measured on run 33886166814: `choco install pandoc` cost **124 s** on
# windows-2022 — 28 % of the whole job and the critical path of the entire
# workflow — against 45 s for apt on ubuntu and 8 s for brew on macOS. Pulling
# the release archive is a ~30 MB download and an unzip.
#
# The second reason matters more than the first. Three package managers ship
# three different pandoc versions, so the `pandoc` parser's recorded engine
# version differed per cell and nothing said so. A pinned archive makes every
# runner adapt the *same* engine, which is what lets a parser test assert
# behaviour rather than tolerate it (roadmap 4.1, ADR-0032).
#
# The archive is a supply-chain input (threat model B2), so it is pinned by
# version *and* verified against a digest recorded here. An unpinned download
# would trade a slow install for an unreviewed binary.

inputs:
  version:
    description: The pandoc release to install. Must be 3.x — the adapter refuses older.
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Install pandoc ${{ inputs.version }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        base="https://github.com/jgm/pandoc/releases/download/${VERSION}"
        dest="${RUNNER_TEMP}/pandoc"
        mkdir -p "$dest"

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   asset="pandoc-${VERSION}-linux-amd64.tar.gz"
                       digest="37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6" ;;
          Windows-X64) asset="pandoc-${VERSION}-windows-x86_64.zip"
                       digest="2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d" ;;
          macOS-X64)   asset="pandoc-${VERSION}-x86_64-macOS.zip"
                       digest="3b1c1b57f160112c821d02f23d946ede8b7f57a6ccf4632a25a512d334a9291f" ;;
          macOS-ARM64) asset="pandoc-${VERSION}-arm64-macOS.zip"
                       digest="15806bedf9517bfead72e88fe6a6696635c3691efbb6e152173440e9c5bb50b4" ;;
          *) echo "::error::no pinned pandoc for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac

        curl --fail --silent --show-error --location --retry 3 \
          --output "${dest}/${asset}" "${base}/${asset}"

        # No single digest tool is on all three runners: Git Bash on Windows has
        # `sha256sum` and no `shasum`, macOS has `shasum` and no `sha256sum`.
        # Compare the strings ourselves rather than depend on a `--check` flag
        # whose spelling also varies.
        #
        # Every one of them reads **stdin**, so no filename appears in the output.
        # That is not tidiness: `RUNNER_TEMP` on Windows is `D:\a\_temp`, and GNU
        # coreutils escapes a line whose filename contains a backslash by
        # prefixing the whole thing with `\` — which produced a digest differing
        # from the pinned one by exactly that character, and a refusal that was
        # right about the mismatch and wrong about the cause.
        if command -v sha256sum > /dev/null; then
          actual=$(sha256sum < "${dest}/${asset}" | cut -d' ' -f1)
        elif command -v shasum > /dev/null; then
          actual=$(shasum -a 256 < "${dest}/${asset}" | cut -d' ' -f1)
        else
          actual=$(openssl dgst -sha256 < "${dest}/${asset}" | awk '{print $NF}')
        fi

        # Verified before extraction: an archive that is not the one this file was
        # reviewed against must never reach the filesystem as executables.
        if [ "$actual" != "$digest" ]; then
          echo "::error::${asset} does not match its pinned digest"
          echo "  expected ${digest}"
          echo "  actual   ${actual}"
          exit 1
        fi

        case "$asset" in
          *.tar.gz) tar -xzf "${dest}/${asset}" -C "$dest" ;;
          *.zip)    unzip -q "${dest}/${asset}" -d "$dest" ;;
        esac

        # Find the binary rather than predict where it lands. The archives do not
        # agree: the Windows zip holds `pandoc-<version>/pandoc.exe`, the macOS
        # ones `pandoc-<version>-<arch>/bin/pandoc` — an arch suffix that a
        # hard-coded `pandoc-<version>` prefix misses, which is exactly how the
        # first version of this action passed on Linux and failed on macOS.
        binary=$(find "$dest" -type f \( -name pandoc -o -name pandoc.exe \) | head -n 1)
        if [ -z "$binary" ]; then
          echo "::error::no pandoc binary found under ${dest} after extracting ${asset}"
          find "$dest" -maxdepth 3 | head -n 20
          exit 1
        fi
        echo "$(dirname "$binary")" >> "$GITHUB_PATH"

    - name: Confirm the pinned engine is the one on PATH
      shell: bash
      run: |
        set -euo pipefail
        # A silent failure here would show up much later as parser tests that
        # skip rather than run, which reads as a pass.
        pandoc --version | head -n 1
        pandoc --version | head -n 1 | grep -q "${{ inputs.version }}"
